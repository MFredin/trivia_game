<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Restricted Section — HP Trivia</title>
    <meta
      name="description"
      content="A wizarding-world trivia archive: timed runs, live duels, house leaderboards and a weekly challenge."
    />
    <!-- The page has always been dark; without this the browser still paints the scrollbars,
         form controls and the flash before first paint in light colours. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a0607" />
    <!-- Inline rather than a file: an open book drawn from the same primitives as the rest of
         the ornament, so there is nothing to fetch (the browser's automatic /favicon.ico
         request was the app's only console error) and no image asset to license. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231a0607'/%3E%3Cpath d='M16 9c-2.4-1.6-5-2.1-7.5-2v14c2.5-.1 5.1.4 7.5 2 2.4-1.6 5-2.1 7.5-2V7c-2.5-.1-5.1.4-7.5 2z' fill='none' stroke='%23d3a625' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 9v14' stroke='%23d3a625' stroke-width='1.8'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
