<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Restricted Section — HP Trivia</title>
    <meta
      name="description"
      content="A wizarding-world trivia archive: timed runs, live duels, house leaderboards and a weekly challenge."
    />
    <!-- Link-preview tags (Slack/Discord/iMessage/Facebook via Open Graph, Twitter/X via its
         own Card tags). og:image/twitter:image point at /og-image.png, a PNG screenshot of a
         static card built from this app's own design tokens and BrandMark SVG — see
         scripts/generate-og-image.mjs for how it's produced and why a screenshot is used
         instead of a hand-authored or external image (CLAUDE.md's "no image files" rule is
         about ornament *inside* the app; this is an external platform's rendering requirement,
         and the source of the raster is still 100% this app's own CSS/SVG).
         og:url/og:image must be absolute per the OG spec; this repo has no fixed production
         domain checked in anywhere (not README.md, not frontend/.env.example), so the actual
         live frontend domain below was looked up directly from the Railway project (service
         "incredible-blessing", production environment) rather than guessed — it's whatever
         Railway auto-assigned when the service was created, not a chosen name. If the frontend
         is ever moved to a custom domain, update both URLs below to match. -->
    <meta property="og:title" content="The Restricted Section — HP Trivia" />
    <meta
      property="og:description"
      content="A wizarding-world trivia archive: timed runs, live duels, house leaderboards and a weekly challenge."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://incredible-blessing-production-bfad.up.railway.app/" />
    <meta property="og:image" content="https://incredible-blessing-production-bfad.up.railway.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Restricted Section — HP Trivia" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Restricted Section — HP Trivia" />
    <meta
      name="twitter:description"
      content="A wizarding-world trivia archive: timed runs, live duels, house leaderboards and a weekly challenge."
    />
    <meta name="twitter:image" content="https://incredible-blessing-production-bfad.up.railway.app/og-image.png" />
    <!-- The page has always been dark; without this the browser still paints the scrollbars,
         form controls and the flash before first paint in light colours. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1a0607" />
    <!-- The brand mark (see src/components/BrandMark.jsx): a rubricated initial in the
         same open corner brackets as the app's own Plate component. Inline rather than a
         file, so there is nothing to fetch (the browser's automatic /favicon.ico request
         was once the app's only console error) and no image asset to license. Fixed ink
         and gilt, not house-tinted — a favicon is served before any account is known. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231a0607'/%3E%3Cpath d='M14 30 V14 H30' fill='none' stroke='%23d3a625' stroke-width='4' stroke-linecap='square'/%3E%3Cpath d='M17 17 q0 6 6 6 q0 -6 -6 -6 Z' fill='%23d3a625'/%3E%3Cpath d='M86 30 V14 H70' fill='none' stroke='%23d3a625' stroke-width='4' stroke-linecap='square'/%3E%3Cpath d='M83 17 q0 6 -6 6 q0 -6 6 -6 Z' fill='%23d3a625'/%3E%3Cpath d='M14 70 V86 H30' fill='none' stroke='%23d3a625' stroke-width='4' stroke-linecap='square'/%3E%3Cpath d='M17 83 q0 -6 6 -6 q0 6 -6 6 Z' fill='%23d3a625'/%3E%3Cpath d='M86 70 V86 H70' fill='none' stroke='%23d3a625' stroke-width='4' stroke-linecap='square'/%3E%3Cpath d='M83 83 q0 -6 -6 -6 q0 6 6 6 Z' fill='%23d3a625'/%3E%3Ctext x='50' y='65' font-family='%22IM Fell English%22,%22Iowan Old Style%22,Georgia,serif' font-size='52' text-anchor='middle' fill='%23d3a625'%3ER%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
