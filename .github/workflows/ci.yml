# Nothing ran these before. The repo had 26 tests and a contrast audit, and both only ever
# ran when somebody remembered to; Railway deploys straight off main with no gate in between.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The session-flow tests need a real database — that part of the app is exactly what the
    # pure unit tests could not cover, and what has actually broken in front of players.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trivia_game
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trivia_game
      QUESTION_TOKEN_SECRET: ci-question-secret
      AUTH_TOKEN_SECRET: ci-auth-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run db:migrate
        working-directory: backend
      - run: npm run db:seed
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Exits non-zero on any gated pairing below its WCAG threshold, so a colour change that
      # breaks contrast fails here rather than in front of a player.
      - run: npm run audit:contrast
        working-directory: frontend
      # A report rather than a gate — it is textual, so a runtime-assembled class name reads
      # as unused. Printed in the log for a reviewer to glance at.
      - run: npm run audit:dead
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest

    # The browser tests drive the real app against the real API, so this job needs both
    # services and a database, exactly as a player would have.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trivia_game
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trivia_game
      QUESTION_TOKEN_SECRET: ci-question-secret
      AUTH_TOKEN_SECRET: ci-auth-secret
      E2E_BASE_URL: http://localhost:5175

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run db:migrate && npm run db:seed
        working-directory: backend
      # nohup and a log file, so the process outlives the step that started it and its output
      # is still readable if the wait below times out.
      - name: Start the API
        run: nohup node src/index.js > /tmp/api.log 2>&1 &
        working-directory: backend
      - name: Start the app
        run: nohup npx vite --port 5175 --strictPort > /tmp/app.log 2>&1 &
        working-directory: frontend
      - name: Wait for both to answer
        run: npx --yes wait-on http://localhost:4000/api/health http://localhost:5175 --timeout 60000
      - name: Show service logs if anything failed
        if: failure()
        run: tail -50 /tmp/api.log /tmp/app.log || true
      # The browser Playwright downloads above, not the sandbox's — PLAYWRIGHT_CHROMIUM is how
      # a machine with its own copy points at it instead.
      - run: npm run e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_CHROMIUM: ''
